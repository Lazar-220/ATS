name: ats

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      POSTGRES_DB: ${POSTGRES_DB:-ats}
    ports:
      # The host port is configurable so another Postgres on 5432 never has to be stopped.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The services below sit behind the `full` profile: `make up` starts Postgres alone,
  # `make up-all` starts everything.
  api:
    profiles: [full]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ats}:${POSTGRES_PASSWORD:-ats}@postgres:5432/${POSTGRES_DB:-ats}
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    profiles: [full]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ats}:${POSTGRES_PASSWORD:-ats}@postgres:5432/${POSTGRES_DB:-ats}
      UPLOAD_DIR: /app/data/uploads
      # The worker is the only process that calls the LLM.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
      LLM_RPM: ${LLM_RPM:-5}
      LLM_CACHE_DIR: /app/data/llm_cache
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
      - llm_cache:/app/data/llm_cache
    # Time to finish the job in progress after SIGTERM before Docker kills the container.
    stop_grace_period: 30s

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  pgdata:
  # Shared by api (writes) and worker (reads): the PDFs, named by sha256.
  uploads:
  # LLM responses keyed by prompt hash: a restart does not pay for the same call twice.
  llm_cache:
